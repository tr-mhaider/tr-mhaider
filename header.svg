<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Syed Murtaz Haider, Backend and Infrastructure Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36BCF7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#36BCF7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#36BCF7" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#36BCF7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#36BCF7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="240" fill="url(#bg)"/>
  <rect width="1000" height="240" fill="url(#grid)"/>
  <ellipse cx="500" cy="120" rx="420" ry="110" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <text x="500" y="112" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,'Segoe UI',Arial,sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">Syed Murtaz Haider</text>
  <rect x="300" y="132" width="400" height="2" fill="url(#accent)"/>
  <text x="500" y="172" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,'Segoe UI',Arial,sans-serif" font-size="20" fill="#36BCF7" letter-spacing="3">BACKEND &amp; INFRASTRUCTURE ENGINEER</text>
</svg>
